## Settings file was created by Research Labs Consumption.

[General]

## Master switch. When false, the labs still research but cost no resources.
Enabled = true

## Multiplier applied to every lab's daily input rate. 2 = double cost, 0.5 = half.
RateMultiplier = 1

## Log every daily deduction. Useful for debugging, very noisy otherwise.
VerboseLogging = false

[Diagnostics]

## One-shot diagnostic. When true, dumps the members of the game's Facility / Lab /
## Refinery / research types to the BepInEx log at startup, then does nothing else. Used
## to discover the API for starvation-gating research. Set back to false after copying the log.
DumpGameApi = false
